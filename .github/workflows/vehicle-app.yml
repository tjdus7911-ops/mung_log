# 차량용 앱(Pleos Connect) 빌드 · 단위 테스트
# - build: Pleos SDK Stub 빌드(일반 에뮬레이터에서도 실행) + 단위 테스트
# - build-pleos: 공개 Maven(nexus-playground.pleos.ai)의 실제 Pleos SDK 와 함께 컴파일 → 공모전 제출용 APK
name: vehicle-app
on:
  push:
    paths: ['vehicle-app/**', '.github/workflows/vehicle-app.yml']
  pull_request:
    paths: ['vehicle-app/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: vehicle-app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build & unit test (stub)
        run: |
          chmod +x gradlew
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug -Pmungroad.usePleosSdk=false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mungroad-car-demo-debug
          path: |
            vehicle-app/app/build/outputs/apk/debug/*.apk
            vehicle-app/app/build/reports/tests/
          if-no-files-found: warn
      # 시안 비교용 스크린샷(Robolectric) → ci-screenshots 브랜치에 저장(앱 코드와 분리)
      - name: Publish screenshots
        if: always()
        working-directory: .
        run: |
          shopt -s nullglob
          files=(vehicle-app/app/build/outputs/roborazzi/*.png)
          [ ${#files[@]} -eq 0 ] && { echo "no screenshots"; exit 0; }
          mkdir -p /tmp/shots && cp "${files[@]}" /tmp/shots/
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git fetch origin ci-screenshots || true
          git switch --orphan ci-screenshots-tmp
          git rm -rf --quiet . || true
          mkdir -p vehicle && cp /tmp/shots/*.png vehicle/
          echo "${GITHUB_SHA}" > vehicle/SOURCE_SHA
          git add vehicle && git commit -m "screenshots ${GITHUB_SHA::7}"
          git push -f origin ci-screenshots-tmp:ci-screenshots

  build-pleos:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: vehicle-app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build with Pleos SDK (NaviHelper · Vehicle · TextToSpeech)
        run: |
          chmod +x gradlew
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties
          ./gradlew --no-daemon :app:assembleRelease -Pmungroad.usePleosSdk=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mungroad-car-pleos-release
          path: vehicle-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
